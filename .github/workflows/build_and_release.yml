name: Build and Release Flutter Apps

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create .env file from secrets
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF
        shell: bash

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      - name: Compile Inno Setup Installer
        run: iscc windows_installer.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ArgityTurnos-Windows-Installer
          path: Output/*.exe

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create .env file from secrets
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF
        shell: bash

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Compress macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../ArgityTurnos-macOS.zip *.app

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: ArgityTurnos-macOS-App
          path: ArgityTurnos-macOS.zip

  publish-to-web:
    name: Publish to Argity Web and GitHub Releases
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flutter code
        uses: actions/checkout@v4
        with:
          path: flutter-app
          
      - name: Obtener versión desde pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep 'version:' flutter-app/pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detectada versión $VERSION"

      - name: Checkout ArgityPage repo
        uses: actions/checkout@v4
        with:
          repository: matifere/argity-page
          token: ${{ secrets.PAGE_REPO_TOKEN }}
          path: argity-page

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: ArgityTurnos-Windows-Installer
          path: release_assets

      - name: Download macOS App
        uses: actions/download-artifact@v4
        with:
          name: ArgityTurnos-macOS-App
          path: release_assets

      - name: Rename assets for Release
        run: |
          mv release_assets/*.exe release_assets/Argity-Windows.exe || true
          mv release_assets/*.zip release_assets/Argity-Mac.zip || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Versión ${{ env.VERSION }}
          files: release_assets/*
          body: "Lanzamiento automático de la versión ${{ env.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar script de release y subir cambios
        working-directory: ./argity-page
        run: |
          npm install
          npm run release ${{ env.VERSION }} "Lanzamiento automático desde GitHub Actions de la versión ${{ env.VERSION }}."
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/version.json
          git commit -m "chore: Actualización automática del version.json a la versión ${{ env.VERSION }}" || true
          git push
